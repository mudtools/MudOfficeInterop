name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack libraries
        shell: pwsh
        run: |
          $libs = @(
            'MudTools.OfficeInterop',
            'MudTools.OfficeInterop.Vbe',
            'MudTools.OfficeInterop.Excel',
            'MudTools.OfficeInterop.Word',
            'MudTools.OfficeInterop.PowerPoint'
          )
          foreach ($p in $libs) {
            dotnet pack "$p/$p.csproj" -c Release -o out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore with local packages
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'nuget.config'
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$PWD/out" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Path $config -Encoding utf8
          dotnet restore MudTools.OfficeInterop.slnx --configfile $config

      - name: Build solution
        run: dotnet build MudTools.OfficeInterop.slnx -c Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: out/*.nupkg
          if-no-files-found: error
