name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MudTools.OfficeInterop.slnx -c Release

      - name: Pack
        shell: pwsh
        run: |
          $libs = @(
            'MudTools.OfficeInterop',
            'MudTools.OfficeInterop.Vbe',
            'MudTools.OfficeInterop.Excel',
            'MudTools.OfficeInterop.Word',
            'MudTools.OfficeInterop.PowerPoint'
          )
          foreach ($p in $libs) {
            dotnet pack "$p/$p.csproj" -c Release --no-build -o out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: out/*.nupkg
          if-no-files-found: error
